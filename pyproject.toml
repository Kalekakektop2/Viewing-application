[project]
name = "viewing-application"
version = "0.1.0"
description = "Windows game overlay with Vision AI (Gemini)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6.0",
  "mss>=9.0.1",
  "Pillow>=10.0.0",
  "pynput>=1.7.6",
  "python-dotenv>=1.0.0",
  "google-genai>=1.0.0",
]

[project.scripts]
viewing = "viewing_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
